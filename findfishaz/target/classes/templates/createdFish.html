<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Success!</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1 class="btn-fit" th:text="${createMessage}">Status</h1>

        <div class="container" th:if="${createMessage == 'Fish Created'}">
            <h3>Fish Details:</h3>
            <p><strong>Species:</strong> <span th:text="${fishSpecies}"></span></p>
            <p><strong>Info:</strong> <span th:text="${fishInfo}"></span></p>
        </div>

        
    
    <p style="text-align: center;">
        <a href="/" class="btn-link" style="font-size: 1rem; padding: 10px 20px;">« Back to Home</a>
    </p>
    
</body>
</html>
