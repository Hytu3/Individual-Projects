<!DOCTYPE html>
<html lang="en">
<head>
    <title>Find Fish AZ</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>Find Fish AZ</h1>
            <h2>Explore and Search Arizona's Waters</h2>
        </div>

        <hr>

        <div class="dashboard-grid">
            <section>
                <h3>View Records</h3>
                
                <p><a href="/fish/allFish" class="btn-link">See all fish</a></p>
                <p><a href="/waterBody/allWaterBodies" class="btn-link">See all water bodies</a></p>
            </section>

            <section>
                <h3>Search the Desert</h3>
                <p><a href="/fish/searchFish" class="btn-link">All Fish That Live In A Specific Water Body</a></p>
                <p><a href="/waterBody/searchWaterBody" class="btn-link">Water Bodies Containing Specific Fish</a></p>
            </section>

            <section>
                <h3>Management</h3>
                <p><a href="/fish/addFish" class="btn-link">Add new fish</a></p>
                <p><a href="/waterBody/addWaterBody" class="btn-link">Add new water body</a></p>
                <p><a href="/fish/addFishToWaterBody" class="btn-link copper-btn">Link Fish to Water Body</a></p>
            </section>
        </div>
    </div>
</body>
</html>
