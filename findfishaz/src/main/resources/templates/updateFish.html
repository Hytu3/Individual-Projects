<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Registry</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    
    

    <div class="container">
        <h2>Update Species Information</h2>

        <form th:action="@{/fish/updated}" method="post" style="text-align: center;">
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px;">Species to Update:</label>
                <input type="text" name="species" class="desert-dropdown" 
                       placeholder="Enter existing species name" required 
                       style="text-align: center; max-width: 350px;" />
            </div>
            
            <div style="margin-bottom: 35px;">
                <label style="display: block; margin-bottom: 8px;">New Species Info:</label>
                <input type="text" name="info" class="desert-dropdown" 
                       placeholder="Enter updated descriptions" required 
                       style="text-align: center; max-width: 350px;" />
            </div>

            <button type="submit" class="btn-link" style="cursor: pointer; width: 100%; max-width: 300px;">
                Update Species Info
            </button>
            
        </form>
        
        <hr style="border: 0; border-top: 1px dashed var(--ink-black); margin: 40px 0; opacity: 0.2;">

        <p style="text-align: center;">
            <a href="/" class="btn-link" style="font-size: 1rem; padding: 10px 20px;">« Back to Home</a>
        </p>
    </div>
</body>
</html>
