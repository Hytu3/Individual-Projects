<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Find Fish - Frontier Registry</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    
    <h1>Search the Waters</h1>

    <div class="container">
        <h2>Enter Water Body Name</h2>

        <form th:action="@{/fish/findFishByWaterBody}" method="get" style="text-align: center;">
            <div style="margin-bottom: 30px;">
                <label style="display: block; margin-bottom: 15px;">Water Body Name:</label>
                <input type="text" name="name" class="desert-dropdown" placeholder="e.g. Salt River" required 
                       style="text-align: center; max-width: 300px;"/>
            </div>

            <button type="submit" class="btn-link" style="border: 3px solid var(--ink-black); cursor: pointer;">
                Search Local Waters
            </button>
        </form>
    
        <p style="text-align: center; margin-top: 40px;">
            <a href="/" class="btn-link" style="font-size: 1rem; padding: 10px 20px;">« Back to Home</a>
        </p>

    </div>
</body>
</html>
